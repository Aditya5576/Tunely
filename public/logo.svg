<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0d0718" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.8)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.4)" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container Badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Subtle Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Minimalist Neon Soundwave & Note Icon -->
  <g filter="url(#neonGlow)" transform="translate(0, 0)">
    <!-- Equalizer Sound Bars -->
    <rect x="136" y="210" width="28" height="92" rx="14" fill="url(#neonGrad)" opacity="0.85" />
    <rect x="188" y="150" width="28" height="212" rx="14" fill="url(#neonGrad)" opacity="0.95" />
    <rect x="240" y="96" width="28" height="320" rx="14" fill="url(#neonGrad)" />
    <rect x="292" y="160" width="28" height="192" rx="14" fill="url(#neonGrad)" opacity="0.95" />
    <rect x="344" y="220" width="28" height="72" rx="14" fill="url(#neonGrad)" opacity="0.85" />

    <!-- Connecting Music Wave Arc -->
    <path d="M 116 256 C 200 130, 312 382, 396 256" fill="none" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>