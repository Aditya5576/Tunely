name = "jiosaavn-api"
main = "./src/server.ts"
compatibility_date = "2024-09-28"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "tunely-db"
database_id = "6e0b7d5b-6de2-4fc4-b5ff-f7128b7cd471"

[[kv_namespaces]]
binding = "TUNELY_SESSIONS"
id = "a169bd35c80d4b30858f68f3f2ee4566"

[durable_objects]
bindings = [
  { name = "USER_SYNC_DO", class_name = "UserSyncDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncDurableObject"]
